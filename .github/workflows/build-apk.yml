name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Environment & Secrets
        env:
          OPENROUTER_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Setting up .env file..."
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "OPENROUTER_API_KEY=MY_OPENROUTER_API_KEY" > .env
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
          fi

          if [ -n "$OPENROUTER_SECRET" ]; then
            sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OPENROUTER_SECRET|" .env || echo "OPENROUTER_API_KEY=$OPENROUTER_SECRET" >> .env
            echo "OPENROUTER_API_KEY injected successfully from GitHub Secrets."
          fi

          if [ -n "$GEMINI_SECRET" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_SECRET|" .env || echo "GEMINI_API_KEY=$GEMINI_SECRET" >> .env
            echo "GEMINI_API_KEY injected successfully from GitHub Secrets."
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          echo "Setting up debug.keystore for assembleDebug..."
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore successfully restored from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore generated successfully via keytool"
          fi

      - name: Generate Automatic Release Keystore
        run: |
          echo "Generating automated upload keystore for assembleRelease..."
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Diskusiku, OU=Mobile, O=Diskusiku, L=Jakarta, ST=DKI, C=ID"
          echo "Release keystore created at $(pwd)/my-upload-key.jks"

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Creating google-services.json for Google Services plugin..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "diskusiku-prototype",
              "storage_bucket": "diskusiku-prototype.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.diskusiku.kypxmq"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_firebase_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
