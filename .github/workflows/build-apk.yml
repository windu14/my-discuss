name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Environment & Secrets
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Setting up .env file..."
          if [ -n "$GEMINI_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_SECRET" > .env
            echo "GEMINI_API_KEY injected successfully from GitHub Secrets."
          else
            echo "GEMINI_API_KEY secret not found in repository. Creating prototype fallback."
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

      - name: Generate Automatic Release Keystore
        run: |
          echo "Generating automated upload keystore for release build..."
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Diskusiku, OU=Mobile, O=Diskusiku, L=Jakarta, ST=DKI, C=ID"
          echo "Keystore created at $(pwd)/my-upload-key.jks"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
