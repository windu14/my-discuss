name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment & Secrets
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Setting up .env file..."
          if [ -n "$GEMINI_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_SECRET" > .env
            echo "GEMINI_API_KEY injected from GitHub Secrets."
          else
            echo "GEMINI_API_KEY not found in repository secrets, using .env.example fallback."
            cp .env.example .env
          fi

      - name: Generate Automatic Keystore (Self-Signed)
        run: |
          echo "Generating automated upload keystore for release build..."
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Diskusiku App, OU=Android, O=Diskusiku, L=Jakarta, ST=ID, C=ID"
          echo "Keystore generated successfully at $(pwd)/my-upload-key.jks"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskusiku-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
